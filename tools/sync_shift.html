<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Syncope On Call</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&family=Source+Serif+4:wght@600&display=swap">
<style>
/* Layout: left column is the patient (monitor + chart), right column is the decision. The monitor is the one dark, high-contrast object; everything else stays quiet. */
:root {
  --bg: #f4f6f9; --surface: #ffffff; --ink: #17202e; --muted: #566274; --line: #d3d9e3; --n-tint: #e9ecf1;
  --best: #2e6b45; --best-t: #d9eadf; --ok: #86690a; --ok-t: #f2e9c9; --poor: #b85a0f; --poor-t: #f6e4d4; --harm: #b3261e; --harm-t: #f6dddb;
  --on: #ffffff;
  --mon-bg: #0b1218; --mon-line: #22323f; --mon-dim: #6f8798; --mon-ok: #5de08a; --mon-warn: #f2c14e; --mon-bad: #ff6b5e; --mon-cyan: #62d6ff;
  --display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151d; --surface: #171e29; --ink: #e8ecf2; --muted: #98a3b5; --line: #2d3747; --n-tint: #232c3a;
    --best: #62b58a; --best-t: #1a3226; --ok: #d9b43a; --ok-t: #352e14; --poor: #f08a45; --poor-t: #3a2716; --harm: #e5645a; --harm-t: #3a1f1e;
    --on: #12100a; --mon-bg: #05090d; --mon-line: #1c2a35;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10151d; --surface: #171e29; --ink: #e8ecf2; --muted: #98a3b5; --line: #2d3747; --n-tint: #232c3a;
  --best: #62b58a; --best-t: #1a3226; --ok: #d9b43a; --ok-t: #352e14; --poor: #f08a45; --poor-t: #3a2716; --harm: #e5645a; --harm-t: #3a1f1e;
  --on: #12100a; --mon-bg: #05090d; --mon-line: #1c2a35;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55; margin: 0;
  padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1 { font-family: var(--display); font-weight: 600; font-size: clamp(26px, 5vw, 34px); line-height: 1.15; margin: 0; }
h2 { font-family: var(--display); font-weight: 600; font-size: 21px; line-height: 1.25; margin: 0 0 6px; text-wrap: balance; }
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.mono { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
button { font: inherit; }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.btn { font-weight: 500; border: 1px solid var(--ink); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 9px 18px; cursor: pointer; }
.btn.primary { background: var(--ink); color: var(--bg); }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; min-width: 0; }
.grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 18px; align-items: start; }
@media (max-width: 760px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

/* monitor */
.monitor { background: var(--mon-bg); color: var(--mon-cyan); border-radius: 8px; padding: 14px 16px; border: 1px solid var(--mon-line); }
.monitor .head { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--mon-dim); margin-bottom: 8px; }
.vit { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; }
.vit div { border-top: 1px solid var(--mon-line); padding-top: 6px; }
.vit .l { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; color: var(--mon-dim); display: flex; align-items: center; gap: 6px; }
.vit .v { font-family: var(--mono); font-weight: 600; font-size: 34px; line-height: 1.1; transition: color .4s; }
.vit .u { font-size: 12px; color: var(--mon-dim); margin-left: 4px; font-weight: 500; }
.v.ok { color: var(--mon-ok); } .v.warn { color: var(--mon-warn); } .v.bad { color: var(--mon-bad); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mon-ok); animation: beat 1s infinite; }
@keyframes beat { 0%, 100% { opacity: 1; } 50% { opacity: .15; } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none; } .vit .v { transition: none; } }

.chart ul { margin: 8px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.chart li.new { font-weight: 600; }

/* decision */
.scene { font-size: 16px; margin: 0 0 14px; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { text-align: left; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 11px 14px; cursor: pointer; line-height: 1.45; }
.opt:hover:not(:disabled) { border-color: var(--ink); }
.opt:disabled { cursor: default; opacity: .62; }
.opt.chosen { opacity: 1; border-width: 2px; }
.opt.chosen.best { border-color: var(--best); } .opt.chosen.ok { border-color: var(--ok); }
.opt.chosen.poor { border-color: var(--poor); } .opt.chosen.harm { border-color: var(--harm); }
.fb { border-radius: 6px; padding: 12px 14px; margin-top: 12px; }
.fb .tag { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
.fb p { margin: 4px 0 12px; }
.fb.best { background: var(--best-t); } .fb.ok { background: var(--ok-t); } .fb.poor { background: var(--poor-t); } .fb.harm { background: var(--harm-t); }
.fb.best .tag { color: var(--best); } .fb.ok .tag { color: var(--ok); } .fb.poor .tag { color: var(--poor); } .fb.harm .tag { color: var(--harm); }
.pager { border-left: 6px solid var(--ink); background: var(--n-tint); border-radius: 4px; padding: 12px 14px; }
.pager b { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; }

/* home + debrief */
.cases { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 14px; }
.case-card { border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 6px; background: var(--surface); }
.case-card h3 { margin: 0; font-size: 16px; }
.case-card p { margin: 0; font-size: 13px; color: var(--muted); }
.case-card .btn { align-self: flex-start; margin-top: 4px; padding: 6px 14px; }
.meter { height: 8px; background: var(--n-tint); border-radius: 4px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--best); }
.meter i.mid { background: var(--ok); } .meter i.low { background: var(--harm); }
.row { display: grid; grid-template-columns: minmax(0, 190px) minmax(0, 1fr) 56px; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.row .name { font-weight: 500; }
.row .num { font-family: var(--mono); font-size: 13px; text-align: right; }
.revisit { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
@media (max-width: 560px) { .row { grid-template-columns: minmax(0, 1fr) 56px; } .row .meter { grid-column: 1 / -1; order: 3; } }
.big { font-family: var(--display); font-size: 44px; font-weight: 600; line-height: 1; }
a { color: inherit; }
.note { font-size: 13px; color: var(--muted); max-width: 70ch; }
</style>

<main>
  <div class="top">
    <h1>Syncope On Call</h1>
    <span class="mono" id="progress"></span>
  </div>
  <div id="view"></div>
  <p class="note">Study aid, not a clinical decision tool. Driving rules come from Austroads Assessing Fitness to Drive (blackouts section). Confirm every dose in eTG and your hospital protocol.</p>
</main>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var PTS = { best: 2, ok: 1, poor: 0, harm: -1 };
  var LABEL = { best: 'Best move', ok: 'Acceptable', poor: 'Poor choice', harm: 'Harmful' };
  var KIT = 'sync_kit.html';
  var CONCEPTS = {
  was: { n: "Was it syncope?", tab: "1", r: "Brief loss of consciousness from low brain blood flow with fast full recovery. Exclude hypoglycaemia, hypoxia, intoxication, seizure, stroke." },
  kind: { n: "Three kinds", tab: "2", r: "Reflex (trigger, warning), orthostatic (on standing, drugs), cardiac (exertion, lying down, no warning, heart disease, abnormal ECG)." },
  flags: { n: "Red flags", tab: "3", r: "Exertional or supine syncope, no warning, palpitations, chest pain, breathlessness, heart disease, abnormal ECG, low BP, anaemia, family history of sudden death." },
  ecg: { n: "ECG clues", tab: "4", r: "Heart block, long QT, delta wave, Brugada, HCM voltages, ARVC, ischaemia or new arrhythmia." },
  tests: { n: "Tests that help", tab: "5", r: "ECG, telemetry, bloods, glucose, troponin, lying and standing BP. Echo for murmur or heart disease; CT head for head strike or anticoagulants." },
  drive: { n: "Driving", tab: "7", r: "Austroads private: typical vasovagal fit to drive; single unexplained blackout 6 months; two or more 12 months. The licensing authority decides." }
  };
  var CASES = [
  {
  id: "c1", title: "Down on the stairs", where: "Emergency department", time: "23:10", blurb: "Exertional syncope in an older man. Tests red flags and aortic stenosis.",
  intro: "ED: 74-year-old man collapsed climbing the stairs at home, no warning, came round within a minute. Feels fine now.",
  vit: { hr: 76, sbp: 118, dbp: 74, spo2: 97, rr: 16 },
  facts: ["74M; hypertension; 'a heart murmur' mentioned years ago", "Exertional breathlessness for months", "Harsh ejection systolic murmur, quiet second sound", "Small cut on the forehead"],
  decisions: [
  { tag: "flags", scene: "He feels well and wants to go home. What makes you hesitate?", opts: [
  { q: "best", t: "Exertional syncope with no warning and a murmur: these are red flags for cardiac syncope, likely aortic stenosis", fb: "Exertional syncope with an AS murmur carries a high risk of sudden death." },
  { q: "poor", t: "Nothing: he feels fine, discharge", fb: "Feeling fine now is typical of syncope. The red flags decide the plan." }
  ] },
  { tag: "tests", scene: "What do you organise?", opts: [
  { q: "best", t: "Admit to telemetry, ECG, troponin, bloods, urgent echo, and CT head because of the head strike if he takes anticoagulants or has neurological signs", reveal: ["Echo: severe aortic stenosis, valve area 0.6 cm²"], fb: "Echo confirms the cause. Telemetry covers arrhythmia meanwhile." },
  { q: "poor", t: "Outpatient Holter monitor", fb: "Exertional syncope with a murmur needs inpatient work-up." }
  ] },
  { tag: "kind", scene: "Severe aortic stenosis. What do you avoid while he waits?", opts: [
  { q: "best", t: "Large doses of vasodilators (GTN) and dehydration; refer to cardiology for valve intervention", fb: "In severe AS, output is fixed. Vasodilators can drop the BP and cause collapse." },
  { q: "poor", t: "Start a diuretic and GTN patch for breathlessness", fb: "Both can cause hypotension in severe AS." }
  ] },
  { tag: "drive", scene: "He asks about driving.", opts: [
  { q: "best", t: "No driving until the cause is treated and cardiology clears him; explain his duty to report to the licensing authority", fb: "Cardiac syncope follows the cardiovascular standards; the licensing authority decides." },
  { q: "poor", t: "He can drive tomorrow", fb: "Not with untreated cardiac syncope." }
  ] }
  ],
  ends: { hi: "You spotted cardiac syncope behind a well-looking patient.", mid: "He was looked after, but a step was missed.", lo: "Review steps 3 and 7 of the Study Kit." }
  },
  {
  id: "c2", title: "The fainting student", where: "Emergency department", time: "21:45", blurb: "A young woman who fainted in a hot queue. Tests the reflex diagnosis and the ECG check.",
  intro: "Triage: 20-year-old woman fainted after standing 40 minutes in a hot queue. Felt sweaty and sick first, out for 10 seconds.",
  vit: { hr: 78, sbp: 112, dbp: 70, spo2: 99, rr: 14 },
  facts: ["20F; no medical history", "Warning symptoms: nausea, sweaty, vision went grey", "No palpitations, no exertion", "Family history: unknown on her father's side"],
  decisions: [
  { tag: "ecg", scene: "This sounds vasovagal. What is the one test you must still do?", opts: [
  { q: "best", t: "A 12-lead ECG, looking for long QT, WPW, Brugada, HCM and heart block", reveal: ["ECG normal; QTc 420 ms"], fb: "A normal ECG in a classic story makes cardiac syncope very unlikely." },
  { q: "poor", t: "No tests: it is obviously vasovagal", fb: "The ECG is quick and catches the dangerous young-person diagnoses." }
  ] },
  { tag: "was", scene: "Anything else to check at the bedside?", opts: [
  { q: "best", t: "Glucose, and a pregnancy test", fb: "Hypoglycaemia mimics syncope, and ectopic pregnancy can present with collapse." },
  { q: "poor", t: "CT head", fb: "Not without head injury, anticoagulants or neurological signs." }
  ] },
  { tag: "kind", scene: "Everything is normal. What is your advice?", opts: [
  { q: "best", t: "Reflex syncope: explain, avoid long standing in the heat, sit or lie at the first warning, use leg-crossing and hand-grip, and return if it happens with exertion or palpitations", fb: "Education and counter-pressure manoeuvres." },
  { q: "poor", t: "Arrange a tilt-table test and Holter", fb: "Not needed for a single typical vasovagal episode." }
  ] },
  { tag: "drive", scene: "She asks if she can drive.", opts: [
  { q: "best", t: "Yes: typical vasovagal syncope with a clear trigger that would not happen while driving does not stop private driving", fb: "Austroads: vasovagal and unlikely to occur while driving means fit to drive." },
  { q: "poor", t: "No driving for 6 months", fb: "That applies to blackouts of uncertain cause, not typical vasovagal syncope." }
  ] }
  ],
  ends: { hi: "A clean, safe reflex syncope work-up with the right advice.", mid: "She went home safely, but one step was over- or under-done.", lo: "Review steps 4 and 7 of the Study Kit." }
  },
  {
  id: "c3", title: "Dizzy on the ward", where: "Medical ward", time: "06:20", blurb: "An older man who keeps nearly fainting on standing. Tests orthostatic hypotension and drugs.",
  intro: "Nurse call: 81-year-old man fainted getting out of bed to the toilet. Brief, recovered quickly. Third episode this week.",
  vit: { hr: 82, sbp: 104, dbp: 62, spo2: 96, rr: 16 },
  facts: ["81M; admitted with a fall; Parkinson disease, heart failure", "New this week: tamsulosin; furosemide increased", "Drinking poorly", "No chest pain or palpitations"],
  decisions: [
  { tag: "tests", scene: "What bedside test do you ask for?", opts: [
  { q: "best", t: "Lying and standing BP: lying, immediately on standing, and at 3 minutes", reveal: ["Lying 138/78; standing at 1 minute 96/58; at 3 minutes 92/56; heart rate barely changes"], fb: "A fall of 20 systolic or 10 diastolic is orthostatic hypotension." },
  { q: "poor", t: "CT head", fb: "No head injury or focal signs. Find the mechanism first." }
  ] },
  { tag: "kind", scene: "BP falls 46 systolic with little rise in heart rate. What fits?", opts: [
  { q: "best", t: "Orthostatic hypotension from drugs (tamsulosin, more furosemide), poor intake, and autonomic failure from Parkinson disease", fb: "A small heart rate rise suggests a neurogenic (autonomic) component." },
  { q: "poor", t: "Vasovagal syncope", fb: "The trigger is standing, and drugs and Parkinson disease explain it." }
  ] },
  { tag: "kind", scene: "What do you change?", opts: [
  { q: "best", t: "Stop tamsulosin, review the furosemide dose against his fluid status with the team, encourage fluids, stand slowly with help, compression stockings", vit: { sbp: 120, dbp: 70 }, fb: "Treat the causes before thinking about midodrine or fludrocortisone." },
  { q: "harm", t: "Start fludrocortisone tonight", fb: "Fludrocortisone causes fluid retention and can worsen his heart failure. Fix the drugs first, with specialist input." }
  ] }
  ],
  ends: { hi: "You found the drugs behind the falls and fixed them.", mid: "He improved, but a step added risk.", lo: "Review steps 5 and 6 of the Study Kit." }
  }
  ];

  /* ---------- state ---------- */
  var S = { mode: 'home', run: [], ci: 0, di: 0, vit: {}, facts: [], newFacts: [], order: [], picked: null, results: {}, t0: 0 };

  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function merge(a, b) { var o = {}; for (var k in a) o[k] = a[k]; for (var k2 in b) o[k2] = b[k2]; return o; }
  function bestStore(id, val) { try { if (val !== undefined) { var cur = JSON.parse(localStorage.getItem('af-shift') || '{}'); if (cur[id] === undefined || val > cur[id]) { cur[id] = val; localStorage.setItem('af-shift', JSON.stringify(cur)); } } return JSON.parse(localStorage.getItem('af-shift') || '{}')[id]; } catch (e) { return undefined; } }

  /* ---------- monitor ---------- */
  function cls(k, v) {
    if (v === 0) return 'bad';
    if (k === 'spo2') return v < 88 ? 'bad' : v < 92 ? 'warn' : 'ok';
    if (k === 'hr') return v > 130 || v < 40 ? 'bad' : v > 100 ? 'warn' : 'ok';
    if (k === 'sbp') return v < 90 ? 'bad' : v < 100 ? 'warn' : 'ok';
    if (k === 'rr') return v > 30 ? 'bad' : v > 24 ? 'warn' : 'ok';
    return 'ok';
  }
  function monitorHTML(c) {
    var v = S.vit;
    var arrest = v.hr === 0;
    var dur = arrest ? 0 : Math.max(0.35, 60 / v.hr);
    return '<div class="monitor" aria-label="Bedside monitor"><div class="head"><span>' + c.where + '</span><span>' + c.time + '</span></div><div class="vit">' +
      '<div><span class="l"><i class="dot" style="' + (arrest ? 'animation:none;background:var(--mon-bad)' : 'animation-duration:' + dur.toFixed(2) + 's') + '"></i>HR</span><span class="v ' + cls('hr', v.hr) + '">' + (arrest ? '--' : v.hr) + '<span class="u">bpm</span></span></div>' +
      '<div><span class="l">BP</span><span class="v ' + cls('sbp', v.sbp) + '">' + (arrest ? '--/--' : v.sbp + '/' + v.dbp) + '<span class="u">mmHg</span></span></div>' +
      '<div><span class="l">SpO2</span><span class="v ' + cls('spo2', v.spo2) + '">' + (arrest ? '--' : v.spo2) + '<span class="u">%</span></span></div>' +
      '<div><span class="l">RR</span><span class="v ' + cls('rr', v.rr) + '">' + (arrest ? '--' : v.rr) + '<span class="u">/min</span></span></div>' +
      '</div></div>';
  }
  function chartHTML() {
    return '<div class="card chart"><span class="mono">Chart</span><ul>' +
      S.facts.map(function (f) { return '<li>' + f + '</li>'; }).join('') +
      S.newFacts.map(function (f) { return '<li class="new">New: ' + f + '</li>'; }).join('') + '</ul></div>';
  }

  /* ---------- flow ---------- */
  function start(idxs) {
    S.run = idxs; S.ci = 0; S.results = {}; S.t0 = Date.now();
    startCase();
  }
  function startCase() {
    var c = CASES[S.run[S.ci]];
    S.di = 0; S.vit = merge({}, c.vit); S.facts = c.facts.slice(); S.newFacts = []; S.picked = null;
    S.results[c.id] = [];
    S.mode = 'intro'; render();
  }
  function beginDecision() {
    var c = CASES[S.run[S.ci]], d = c.decisions[S.di];
    if (d.vit) S.vit = merge(S.vit, d.vit);
    if (d.reveal) { S.facts = S.facts.concat(S.newFacts); S.newFacts = d.reveal.slice(); }
    else { S.facts = S.facts.concat(S.newFacts); S.newFacts = []; }
    S.order = shuffle(d.opts.map(function (o, i) { return i; }));
    S.picked = null; S.mode = 'decide'; render();
  }
  function pick(i) {
    var c = CASES[S.run[S.ci]], d = c.decisions[S.di], o = d.opts[i];
    if (S.picked !== null) return;
    S.picked = i;
    if (o.vit) S.vit = merge(S.vit, o.vit);
    if (o.reveal) { S.facts = S.facts.concat(S.newFacts); S.newFacts = o.reveal.slice(); }
    S.results[c.id][S.di] = { q: o.q, tag: d.tag };
    render();
  }
  function next() {
    var c = CASES[S.run[S.ci]];
    if (S.di + 1 < c.decisions.length) { S.di++; beginDecision(); }
    else { S.mode = 'caseend'; render(); }
  }
  function caseScore(c) {
    var r = S.results[c.id] || [], pts = 0;
    r.forEach(function (x) { pts += PTS[x.q]; });
    return Math.max(0, pts);
  }
  function caseMax(c) { return c.decisions.length * 2; }
  function afterCase() {
    if (S.ci + 1 < S.run.length) { S.ci++; startCase(); } else { S.mode = 'debrief'; render(); }
  }

  /* ---------- views ---------- */
  function render() {
    var v = $('#view'), p = $('#progress');
    window.scrollTo(0, 0);
    if (S.mode === 'home') { p.textContent = ''; v.innerHTML = homeHTML(); return; }
    var c = CASES[S.run[S.ci]];
    if (S.mode === 'debrief') { p.textContent = 'Debrief'; v.innerHTML = debriefHTML(); return; }
    p.textContent = 'Case ' + (S.ci + 1) + ' of ' + S.run.length + (S.mode === 'decide' ? ' · Decision ' + (S.di + 1) + ' of ' + c.decisions.length : '');
    if (S.mode === 'intro') {
      v.innerHTML = '<div class="grid"><div class="col">' + monitorHTML(c) + chartHTML() + '</div><div class="col"><div class="card"><h2>' + c.title + '</h2><div class="pager"><b>' + c.time + ' · ' + c.where.toUpperCase() + '</b><p style="margin:6px 0 0">' + c.intro + '</p></div><div class="btns" style="margin-top:14px"><button class="btn primary" data-a="go">Go to the bedside</button></div></div></div></div>';
      return;
    }
    if (S.mode === 'decide') {
      var d = c.decisions[S.di], o = S.picked !== null ? d.opts[S.picked] : null;
      var opts = S.order.map(function (i) {
        var oo = d.opts[i], chosen = S.picked === i;
        return '<button class="opt' + (chosen ? ' chosen ' + oo.q : '') + '" data-i="' + i + '"' + (S.picked !== null ? ' disabled' : '') + '>' + oo.t + '</button>';
      }).join('');
      var fb = '';
      if (o) {
        var last = (S.di + 1 === c.decisions.length);
        fb = '<div class="fb ' + o.q + '" role="status"><span class="tag">' + LABEL[o.q] + '</span><p>' + o.fb + '</p>' + bestHint(d, o) + '<button class="btn primary" data-a="next">' + (last ? 'Hand over' : 'Next') + '</button></div>';
      }
      v.innerHTML = '<div class="grid"><div class="col">' + monitorHTML(c) + chartHTML() + '</div><div class="col"><div class="card"><p class="scene">' + d.scene + '</p><div class="opts">' + opts + '</div>' + fb + '</div></div></div>';
      return;
    }
    if (S.mode === 'caseend') {
      var sc = caseScore(c), mx = caseMax(c), pct = Math.round(sc / mx * 100);
      var end = pct >= 80 ? c.ends.hi : pct >= 50 ? c.ends.mid : c.ends.lo;
      var bestPrev = bestStore(c.id, pct);
      v.innerHTML = '<div class="grid"><div class="col">' + monitorHTML(c) + chartHTML() + '</div><div class="col"><div class="card"><span class="mono">Handover</span><h2>' + c.title + '</h2><p class="big">' + pct + '%</p><p class="muted" style="margin:4px 0 12px">' + sc + ' of ' + mx + ' points' + (bestPrev !== undefined ? ' · best on this device ' + bestPrev + '%' : '') + '</p><p>' + end + '</p><div class="btns"><button class="btn primary" data-a="after">' + (S.ci + 1 < S.run.length ? 'Next case' : 'See debrief') + '</button></div></div></div></div>';
    }
  }
  function bestHint(d, o) {
    if (o.q === 'best') return '';
    var b = d.opts.filter(function (x) { return x.q === 'best'; })[0];
    return b ? '<p><b>Best move:</b> ' + b.t + '</p>' : '';
  }
  function homeHTML() {
    var cards = CASES.map(function (c, i) {
      var b = bestStore(c.id);
      return '<div class="case-card"><span class="mono">' + c.time + ' · ' + c.where + '</span><h3>' + c.title + '</h3><p>' + c.blurb + '</p>' + (b !== undefined ? '<p>Best on this device: ' + b + '%</p>' : '') + '<button class="btn" data-a="one" data-i="' + i + '">Play this case</button></div>';
    }).join('');
    return '<div class="card"><h2>You are the RMO on call</h2><p style="max-width:62ch">Three patients, eleven decisions. Make the call, see what it does to the monitor, and read why. Answers are shuffled each time, so you can replay. Close the Study Kit first: this is the test.</p><div class="btns"><button class="btn primary" data-a="all">Start the whole shift</button></div><div class="cases">' + cards + '</div></div>';
  }
  function debriefHTML() {
    var byTag = {}, tot = 0, mx = 0;
    S.run.forEach(function (ci) {
      var c = CASES[ci];
      (S.results[c.id] || []).forEach(function (r) {
        byTag[r.tag] = byTag[r.tag] || { p: 0, m: 0 };
        byTag[r.tag].p += Math.max(0, PTS[r.q]); byTag[r.tag].m += 2;
      });
      tot += caseScore(c); mx += caseMax(c);
    });
    var pct = Math.round(tot / mx * 100);
    var rows = Object.keys(byTag).map(function (k) {
      var x = byTag[k], f = Math.round(x.p / x.m * 100), cn = CONCEPTS[k];
      var cl = f >= 80 ? '' : f >= 50 ? 'mid' : 'low';
      return '<div class="row"><span class="name">' + cn.n + '</span><div class="meter"><i class="' + cl + '" style="width:' + f + '%"></i></div><span class="num">' + x.p + '/' + x.m + '</span>' +
        (f < 80 ? '<div class="revisit"><b>Revisit:</b> ' + cn.r + ' <a href="' + KIT + '#' + cn.tab + '" target="_blank" rel="noopener">Open in the Study Kit</a></div>' : '') + '</div>';
    }).join('');
    var verdict = pct >= 85 ? 'Solid. The pathway is in your head. Replay in two days to see what stuck.' : pct >= 60 ? 'Decent base with gaps. The red and amber bars below are your next study session.' : 'Not there yet, and that is useful to know. Work through the rows below, then replay.';
    return '<div class="card"><span class="mono">Shift debrief</span><p class="big" style="margin-top:6px">' + pct + '%</p><p class="muted" style="margin:4px 0 14px">' + tot + ' of ' + mx + ' points. ' + verdict + '</p>' + rows + '<div class="btns" style="margin-top:16px"><button class="btn primary" data-a="all">Replay the whole shift</button><button class="btn" data-a="home">Pick a case</button></div></div>';
  }

  $('#view').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    var a = b.getAttribute('data-a');
    if (b.classList.contains('opt')) { pick(Number(b.getAttribute('data-i'))); return; }
    if (a === 'all') start([0, 1, 2]);
    else if (a === 'one') start([Number(b.getAttribute('data-i'))]);
    else if (a === 'go') beginDecision();
    else if (a === 'next') next();
    else if (a === 'after') afterCase();
    else if (a === 'home') { S.mode = 'home'; render(); }
  });
  render();
})();
</script>
