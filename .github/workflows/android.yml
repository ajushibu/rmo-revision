name: Android APK
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Fetch the saved signing key (keeps updates installable over the old app)
        run: |
          mkdir -p ~/.android out
          if git ls-remote --exit-code --heads origin apk-build >/dev/null 2>&1; then
            git fetch origin apk-build && git show origin/apk-build:debug.keystore > ~/.android/debug.keystore || true
          fi
          [ -s ~/.android/debug.keystore ] || keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Image tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
      - name: Build
        run: |
          set -o pipefail
          (
          mkdir wrap && cd wrap
          npm init -y >/dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir www && echo '<!doctype html><title>RMO Revision</title>' > www/index.html
          cat > capacitor.config.json <<'EOF'
          {"appId":"app.rmorevision.study","appName":"RMO Revision","webDir":"www","server":{"url":"https://rmo-revision-app.vercel.app","androidScheme":"https"},"backgroundColor":"#0D1518"}
          EOF
          npx cap add android
          R=android/app/src/main/res
          rm -f $R/mipmap-anydpi-v26/ic_launcher*.xml $R/drawable-v24/ic_launcher_foreground.xml $R/drawable/ic_launcher_background.xml
          # Legacy square icon (Android 7 and older) plus adaptive layers (Android 8+): blue background, ECG line in the safe zone
          for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read n s f <<< "$d"
            for x in ic_launcher ic_launcher_round; do convert ../icons/icon-512.png -resize ${s}x${s} $R/mipmap-$n/$x.png; done
            convert -background none ../icons/adaptive-fg-432.png -resize ${f}x${f} $R/mipmap-$n/ic_launcher_foreground.png
          done
          mkdir -p $R/mipmap-anydpi-v26 $R/values
          for x in ic_launcher ic_launcher_round; do
            printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">' '  <background android:drawable="@color/ic_launcher_background"/>' '  <foreground android:drawable="@mipmap/ic_launcher_foreground"/>' '  <monochrome android:drawable="@mipmap/ic_launcher_foreground"/>' '</adaptive-icon>' > $R/mipmap-anydpi-v26/$x.xml
          done
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<resources>' '  <color name="ic_launcher_background">#2F6DB5</color>' '</resources>' > $R/values/ic_launcher_background.xml
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          # Re-sign with the saved key so every build installs over the last one
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner sign --ks ~/.android/debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android app/build/outputs/apk/debug/app-debug.apk
          $BT/apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -i sha-256
          ) 2>&1 | tee out/build.log
      - name: Publish to apk-build branch
        if: always()
        run: |
          cp wrap/android/app/build/outputs/apk/debug/app-debug.apk out/rmo-revision.apk 2>/dev/null || true
          cp ~/.android/debug.keystore out/debug.keystore 2>/dev/null || true
          if [ ! -f out/debug.keystore ]; then keytool -genkey -v -keystore out/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1 || true; fi
          cd out && git init -q && git checkout -q -b apk-build && git config user.name ci && git config user.email ci@example.com
          git add -A && git commit -qm "APK build" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk-build
